[package]
name = "vantage"
version = "0.1.2"
edition = "2021"
license = "AGPL-3.0-only"
description = "Measure inside a systemd-nspawn guest from the right vantage point"
repository = "https://github.com/achimcc/vantage"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
