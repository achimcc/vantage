[package]
name = "vantage"
version = "0.3.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "Measure inside a systemd-nspawn guest from the right vantage point"
repository = "https://github.com/achimcc/vantage"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[lints.rust]
# `unsafe` is denied crate-wide. vantage needs it for the syscalls std does not
# wrap (setns, ptrace, seccomp, pidfd_open, capset, memfd_create): each
# function that does carries `#[allow(unsafe_code)]`, each block a SAFETY
# comment.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = true
